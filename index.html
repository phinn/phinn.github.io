  .hero .cta-row { display: flex; gap: 14px; flex-wrap: wrap; }

  .proof { border-left: 3px solid var(--line); padding-left: 14px; }
  .proof b { font-size: 22px; display: block; }
  .proof span { font-size: 13px; color: var(--ink-soft); }

  h2 { font-size: 26px; margin-bottom: 8px; letter-spacing: -.3px; }
  .sec-sub { color: var(--ink-soft); font-size: 15px; margin-bottom: 30px; }

  .svc {

  .svc:hover { border-color: var(--accent); }

  .svc p { font-size: 14px; color: var(--ink-soft); margin-bottom: 12px; }
  .svc .price { font-size: 14px; font-weight: 600; color: var(--green); }

  .case-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
  .case {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 22px;

  .case h3 { font-size: 16px; margin-bottom: 8px; }
  .case p { font-size: 14px; color: var(--ink-soft); }
  .case .meta { margin-top: 12px; font-size: 13px; color: var(--accent); font-weight: 600; }

  details p { margin-top: 10px; font-size: 14px; color: var(--ink-soft); }

  footer { padding: 32px 0; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 13px; }

var LANGS = ['en','zh','ja'];
var lang = 'en';
try { var saved = localStorage.getItem('phinn-lang'); if (LANGS.indexOf(saved) !== -1) lang = saved; } catch(e){}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function t(key){ return I18N[lang][key] != null ? I18N[lang][key] : (I18N.en[key] || ''); }

function applyLang(l){
  lang = l;
  try { localStorage.setItem('phinn-lang', l); } catch(e){}
  var d = I18N[l];
  document.documentElement.lang = l === 'zh' ? 'zh-CN' : l;
  document.title = d._title;
  document.querySelectorAll('.lang button').forEach(function(b){ b.classList.toggle('on', b.dataset.l === l); });
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){ el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-html]').forEach(function(el){ el.innerHTML = t(el.dataset.i18nHtml); });
  renderFaq();
}

/* ---- FAQ 折叠列表(按语言重建) ---- */
function renderFaq(){
  var box = document.getElementById('faq-list');
  var html = '';
  for (var i = 1; i <= 5; i++) {
    html += '<details><summary>' + esc(t('faq.q' + i)) + '</summary><p>' + esc(t('faq.a' + i)) + '</p></details>';
  }
  box.innerHTML = html;
}

/* ---- boot ---- */
renderFaq();
document.querySelectorAll('.lang button').forEach(function(b){
  b.addEventListener('click', function(){ applyLang(b.dataset.l); });
});
applyLang(lang);
