var LANGS = ['en','zh','ja'];
var lang = 'en';
try { var saved = localStorage.getItem('phinn-lang'); if (LANGS.indexOf(saved) !== -1) lang = saved; } catch(e){}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function t(key){ return I18N[lang][key] != null ? I18N[lang][key] : (I18N.en[key] || ''); }

function applyLang(l){
  lang = l;
  try { localStorage.setItem('phinn-lang', l); } catch(e){}
  var d = I18N[l];
  document.documentElement.lang = l === 'zh' ? 'zh-CN' : l;
  document.title = d._title;
  document.querySelectorAll('.lang button').forEach(function(b){ b.classList.toggle('on', b.dataset.l === l); });
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){ el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-html]').forEach(function(el){ el.innerHTML = t(el.dataset.i18nHtml); });
  renderFaq();
  renderApps();
}

/* ---- FAQ 折叠列表(按语言重建) ---- */
function renderFaq(){
  var box = document.getElementById('faq-list');
  var html = '';
  for (var i = 1; i <= 5; i++) {
    html += '<details><summary>' + esc(t('faq.q' + i)) + '</summary><p>' + esc(t('faq.a' + i)) + '</p></details>';
  }
  box.innerHTML = html;
}

/* ---- App 墙(22 款,与 kinetapp/apps.html 同源) ---- */
function renderApps(){
  var box = document.getElementById('app-grid');
  var h = '';
  for (var i = 0; i < APPS.length; i++) {
    var a = APPS[i];
    var tag = lang === 'zh' ? (a.tagZh || a.tag) : (lang === 'ja' ? (a.tagJa || a.tag) : a.tag);
    h += '<a class="app-card" href="' + a.url + '" target="_blank" rel="noopener">'
      + '<img class="app-icon" src="' + a.icon + '" alt="' + esc(a.name) + '" loading="lazy">'
      + '<div class="app-body"><div class="app-top"><b>' + esc(a.name) + '</b><span class="app-price">' + a.price + '</span></div>'
      + '<div class="app-tag">' + esc(tag) + '</div>'
      + '<div class="app-meta"><span>' + a.platform + '</span>'
      + (a.duoNative ? '<em class="duo">DUO NATIVE</em>' : '')
      + '</div></div></a>';
  }
  box.innerHTML = h;
}

/* ---- boot ---- */
renderFaq();
renderApps();
document.querySelectorAll('.lang button').forEach(function(b){
  b.addEventListener('click', function(){ applyLang(b.dataset.l); });
});
applyLang(lang);
