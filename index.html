<style>
  :root {
    --paper: #f7f4ee;
    --paper-deep: #f0ebe1;
    --ink: #2b2620;
    --ink-soft: #6b6357;
    --line: #e0d8c8;
    --accent: #b4542e;
    --accent-soft: #f3e2d8;
    --green: #4a7c59;
    --card: #fffdf8;
    --serif: "Fraunces", "Palatino", "Georgia", "Songti SC", "STSong", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --ease: cubic-bezier(.22,.61,.36,1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 76px; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--paper);
    color: var(--ink);
    line-height: 1.75;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 24px; }

  /* header */
  header {
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 50;
    background: rgba(247,244,238,.92);
    backdrop-filter: blur(8px);
  }
  header .wrap { display: flex; align-items: center; justify-content: space-between; }
  .logo { font-weight: 700; font-size: 17px; letter-spacing: .5px; }
  .logo em { font-style: normal; color: var(--accent); }
  .hright { display: flex; align-items: center; gap: 22px; }
  header nav { display: flex; gap: 22px; font-size: 14px; }
  header nav a { color: var(--ink-soft); text-decoration: none; }
  header nav a:hover { color: var(--accent); }
  .lang { display: flex; gap: 4px; }
  .lang button {
    border: 1px solid transparent; background: transparent; cursor: pointer;
    font-size: 12px; letter-spacing: .5px; padding: 3px 9px; border-radius: 14px;
    color: var(--ink-soft); font-family: inherit;
  }
  .lang button:hover { color: var(--accent); }
  .lang button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  /* hero */
  .hero { padding: 88px 0 56px; }
  .hero h1 { font-family: var(--serif); font-size: clamp(30px, 4.6vw, 46px); line-height: 1.22; letter-spacing: -.6px; margin-bottom: 18px; font-weight: 600; }
  .hero h1 strong { color: var(--accent); }
  .hero p.sub { font-size: 17px; color: var(--ink-soft); max-width: 640px; margin-bottom: 28px; }
  .hero .cta-row { display: flex; gap: 14px; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: 12px 26px; border-radius: 8px;
    font-size: 15px; font-weight: 600; text-decoration: none;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(180,84,46,.25); }
  .btn-ghost { border: 1px solid var(--line); color: var(--ink); background: var(--card); }
  .proof-row { margin-top: 34px; display: flex; gap: 36px; flex-wrap: wrap; }
  .proof { border-left: 3px solid var(--line); padding-left: 14px; }
  .proof b { font-family: var(--serif); font-size: 27px; display: block; line-height: 1.3; }
  .proof span { font-size: 13px; color: var(--ink-soft); }

  /* section */
  section { padding: 56px 0; border-top: 1px solid var(--line); }
  h2 { font-family: var(--serif); font-size: clamp(24px, 3vw, 31px); margin-bottom: 8px; letter-spacing: -.3px; font-weight: 600; }
  .eyebrow { display: block; font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
  .sec-sub { color: var(--ink-soft); font-size: 15px; margin-bottom: 30px; }

  .svc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
  .svc {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 24px; transition: border-color .15s;
  }
  .svc:hover { border-color: var(--accent); }
  .svc .tag { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 20px; background: var(--accent-soft); color: var(--accent); margin-bottom: 12px; font-weight: 600; }
  .svc h3 { font-size: 18px; margin-bottom: 8px; }
  .svc p { font-size: 14px; color: var(--ink-soft); margin-bottom: 12px; }
  .svc .price { font-size: 14px; font-weight: 600; color: var(--green); }

  /* cases */
  .case-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
  .case {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 22px;
  }
  .case h3 { font-size: 16px; margin-bottom: 8px; }
  .case p { font-size: 14px; color: var(--ink-soft); }
  .case .meta { margin-top: 12px; font-size: 13px; color: var(--accent); font-weight: 600; }
  .case .fis-diagram { display: block; width: 100%; max-width: 640px; height: auto; margin: 8px auto 14px; border-radius: 8px; }
  /* FIS 卡为案例主视觉:独占一整行(上方 3 卡 + 下方全宽架构图带) */
  .case.case-wide { grid-column: 1 / -1; }
  @media (min-width: 901px) { .case-grid { grid-template-columns: repeat(3, 1fr); } }
  .case-more { display: inline-block; margin-top: 10px; font-size: 13.5px; font-weight: 700; color: var(--accent); text-decoration: none; }
  .case-more:hover { text-decoration: underline; }

  /* app wall: 22 款在架应用(与 kinetapp/apps.html 同源数据与卡片风格) */
  .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .app-card {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; text-decoration: none; color: var(--ink);
    transition: border-color .15s, transform .15s;
  }
  .app-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .app-icon { width: 60px; height: 60px; border-radius: 13px; flex-shrink: 0; }
  .app-body { min-width: 0; }
  .app-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .app-top b { font-size: 14.5px; }
  .app-price { font-size: 12.5px; color: var(--ink-soft); flex-shrink: 0; }
  .app-tag { font-size: 13px; color: var(--ink-soft); margin-top: 5px; line-height: 1.45; }
  .app-meta { margin-top: 8px; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-soft); }
  .app-meta em.duo {
    font-style: normal; background: var(--accent); color: #fff;
    font-size: 10.5px; font-weight: 700; letter-spacing: .4px;
    padding: 2px 7px; border-radius: 9px;
  }

  /* hover 图标弹出的截图轮播浮层(仅指针设备;竖图 320 / Mac 横图 456 两档宽) */
  #shot-pop {
    position: fixed; z-index: 60; width: var(--pop-w, 320px); padding: 10px 10px 9px;
    background: #fff; border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 18px 50px rgba(25, 25, 35, .18), 0 2px 8px rgba(25, 25, 35, .06);
    opacity: 0; transform: translateY(8px) scale(.97);
    transition: opacity .2s ease, transform .2s ease;
    pointer-events: none; display: none;
  }
  #shot-pop.on { display: block; opacity: 1; transform: none; }
  #shot-pop .pop-head { display: flex; align-items: center; gap: 8px; padding: 2px 2px 9px; }
  #shot-pop .pop-head img { width: 26px; height: 26px; border-radius: 6px; flex-shrink: 0; }
  #shot-pop .pop-head b { font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #shot-pop .pop-head span { margin-left: auto; font-size: 12px; color: var(--ink-soft); flex-shrink: 0; }
  #shot-pop .pop-stage {
    background: #f6f4ef; border: 1px solid var(--line); border-radius: 10px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  #shot-pop .pop-stage img {
    display: block; max-width: 100%; max-height: 100%;
    object-fit: contain; border-radius: 8px;
    transition: opacity .18s ease;
  }
  #shot-pop .pop-dots { display: flex; gap: 6px; justify-content: center; padding-top: 9px; }
  #shot-pop .pop-dots i {
    width: 6px; height: 6px; border-radius: 3px; background: #ddd8cf;
    transition: background .15s, width .15s; cursor: pointer;
  }
  #shot-pop .pop-dots i:hover { background: #b9b2a4; }
  #shot-pop .pop-dots i.on { background: var(--accent); width: 16px; }
  @media (hover: none) { #shot-pop { display: none !important; } }

  /* faq */
  details { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; margin-bottom: 10px; }
  details summary { cursor: pointer; font-weight: 600; font-size: 15px; }
  details p { margin-top: 10px; font-size: 14px; color: var(--ink-soft); }

  /* contact */
  .contact-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 16px; }
  .contact-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
  .contact-card b { display: block; margin-bottom: 6px; }
  .contact-card span { font-size: 14px; color: var(--ink-soft); }
  .contact-card a { color: var(--accent); font-weight: 600; text-decoration: none; }

  footer { padding: 36px 0; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 13px; letter-spacing: .2px; }
  footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  footer a { color: var(--ink-soft); }

  @media (max-width: 640px) {
    .hero h1 { font-size: 27px; }
    .marquee { display: none; }
    header nav { display: none; }
  }

  /* hero 图标走马灯: 双轨无缝滚动,hover 暂停,reduced-motion 静止 */
  .marquee { margin-top: 40px; overflow: hidden; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 16px 0; }
  .mq-track { display: flex; gap: 30px; width: max-content; animation: mq 46s linear infinite; }
  .marquee:hover .mq-track { animation-play-state: paused; }
  .mq-track img { width: 38px; height: 38px; border-radius: 9px; display: block; }
  @keyframes mq { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .mq-track { animation: none; } }

  /* apps 分组筛选 chips */
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .chips button {
    border: 1px solid var(--line); background: var(--card); cursor: pointer;
    font-family: inherit; font-size: 13px; padding: 5px 15px; border-radius: 999px;
    color: var(--ink-soft); transition: all .15s;
  }
  .chips button:hover { border-color: var(--accent); color: var(--accent); }
  .chips button.on { background: var(--ink); border-color: var(--ink); color: var(--paper); font-weight: 600; }

  /* 卡片 stagger 入场 + 全站 scroll-reveal */
  .app-card, .svc, .case, .contact-card { opacity: 0; transform: translateY(14px); transition: opacity .5s var(--ease), transform .5s var(--ease); transition-delay: var(--d, 0ms); }
  .rv { opacity: 1 !important; transform: none !important; }
  @media (prefers-reduced-motion: reduce) { .app-card, .svc, .case, .contact-card { opacity: 1; transform: none; transition: none; } }

  /* scrollspy 当前分区高亮 */
  header nav a.here { color: var(--accent); font-weight: 600; }
  .app-grid .empty { grid-column: 1 / -1; text-align: center; color: var(--ink-soft); font-size: 14px; padding: 30px 0; }
</style>
</head>

   默认英文(海外获客主页面),可切中文/日文;选择持久化 localStorage。

    'svc.title': 'Services', 'svc.sub': 'Priced by problem value, not by the hour. First-round assessment is always free.',

var LANGS = ['en','zh','ja'];
var lang = 'en';
try { var saved = localStorage.getItem('phinn-lang'); if (LANGS.indexOf(saved) !== -1) lang = saved; } catch(e){}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function t(key){ return I18N[lang][key] != null ? I18N[lang][key] : (I18N.en[key] || ''); }

function applyLang(l){
  lang = l;
  try { localStorage.setItem('phinn-lang', l); } catch(e){}
  var d = I18N[l];
  document.documentElement.lang = l === 'zh' ? 'zh-CN' : l;
  document.title = d._title;
  document.querySelectorAll('.lang button').forEach(function(b){ b.classList.toggle('on', b.dataset.l === l); });
  document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(function(el){ el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-html]').forEach(function(el){ el.innerHTML = t(el.dataset.i18nHtml); });
  renderFaq();
  renderChips();
  renderApps();
  renderMarquee();
}

/* ---- FAQ 折叠列表(按语言重建) ---- */
function renderFaq(){
  var box = document.getElementById('faq-list');
  var html = '';
  for (var i = 1; i <= 5; i++) {
    html += '<details><summary>' + esc(t('faq.q' + i)) + '</summary><p>' + esc(t('faq.a' + i)) + '</p></details>';
  }
  box.innerHTML = html;
}

/* ---- App 墙(22 款,与 kinetapp/apps.html 同源) ---- */
var appFilter = 'all';
function tagOf(a){
  return lang === 'zh' ? (a.tagZh || a.tag) : (lang === 'ja' ? (a.tagJa || a.tag) : a.tag);
}
function renderApps(){
  var box = document.getElementById('app-grid');
  var h = '', shown = 0;
  for (var i = 0; i < APPS.length; i++) {
    var a = APPS[i];
    if (appFilter !== 'all' && a.group !== appFilter) continue;
    var d = Math.min(shown * 45, 540);
    h += '<a class="app-card" style="--d:' + d + 'ms" href="' + a.url + '" target="_blank" rel="noopener">'
      + '<img class="app-icon" src="' + a.icon + '" alt="' + esc(a.name) + '" loading="lazy">'
      + '<div class="app-body"><div class="app-top"><b>' + esc(a.name) + '</b><span class="app-price">' + a.price + '</span></div>'
      + '<div class="app-tag">' + esc(tagOf(a)) + '</div>'
      + '<div class="app-meta"><span>' + a.platform + '</span>'
      + (a.duoNative ? '<em class="duo">DUO NATIVE</em>' : '')
      + '</div></div></a>';
    shown++;
  }
  if (!shown) h = '<div class="empty"></div>';
  box.innerHTML = h;
  observeCards(box);
  if (window.i18nFillEmpty) window.i18nFillEmpty();
}
/* 卡片入场统一走 IntersectionObserver: 视口内才播放 stagger,滚到再动 */
var cardIO = null;
function observeCards(scope){
  var cards = scope.querySelectorAll('.app-card');
  if (!cards.length) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    cards.forEach(function(c){ c.classList.add('rv'); }); return;
  }
  if (!cardIO) cardIO = new IntersectionObserver(function(es){
    es.forEach(function(en){
      if (en.isIntersecting) { en.target.classList.add('rv'); cardIO.unobserve(en.target); }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });
  cards.forEach(function(c){ cardIO.observe(c); });
}
/* 筛选 chips(文案随语言重建) */
function renderChips(){
  var groups = ['all', 'ai', 'create', 'life', 'focus', 'mactools'];
  var box = document.getElementById('app-chips');
  box.innerHTML = groups.map(function(g){
    return '<button data-g="' + g + '" class="' + (g === appFilter ? 'on' : '') + '">' + esc(t('appf.' + g)) + '</button>';
  }).join('');
  box.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click', function(){
      appFilter = b.dataset.g;
      hidePop();
      box.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); });
      renderApps();
    });
  });
}
/* hero 图标走马灯(双轨无缝) */
function renderMarquee(){
  var imgs = APPS.map(function(a){ return '<img src="' + a.icon + '" alt="">'; }).join('');
  document.getElementById('mq-track').innerHTML = imgs + imgs;
}
/* 滚动入场(卡片/svc/case/contact) + reduced-motion 直通 */
function initReveal(){
  var els = document.querySelectorAll('.app-card, .svc, .case, .contact-card');
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { els.forEach(function(e){ e.classList.add('rv'); }); return; }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if (en.isIntersecting) { en.target.classList.add('rv'); io.unobserve(en.target); }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
  els.forEach(function(e){ io.observe(e); });
}
/* scrollspy 导航高亮 */
function initScrollSpy(){
  var links = {};
  document.querySelectorAll('header nav a').forEach(function(a){
    var id = (a.getAttribute('href') || '').slice(1);
    if (id) links[id] = a;
  });
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if (!en.isIntersecting) return;
      document.querySelectorAll('header nav a').forEach(function(a){ a.classList.remove('here'); });
      var a = links[en.target.id];
      if (a) a.classList.add('here');
    });
  }, { rootMargin: '-30% 0px -55% 0px' });
  ['services', 'cases', 'apps', 'faq', 'contact'].forEach(function(id){
    var el = document.getElementById(id);
    if (el) io.observe(el);
  });
}

/* ---- hover 图标弹截图轮播(App Store CDN 真机截图,仅指针设备) ---- */
var pop = null, popTimer = null, popIdx = 0, popShots = null;
function ensurePop(){
  if (pop) return pop;
  pop = document.createElement('div');
  pop.id = 'shot-pop';
  pop.innerHTML = '<div class="pop-head"><img alt=""><b></b><span></span></div>'
    + '<div class="pop-stage"><img alt=""></div>'
    + '<div class="pop-dots"></div>';
  document.body.appendChild(pop);
  return pop;
}
function popGo(i){
  popIdx = (i + popShots.length) % popShots.length;
  var img = pop.querySelector('.pop-stage img');
  img.style.opacity = '0';
  var pre = new Image();
  pre.onload = function(){ img.src = popShots[popIdx]; img.style.opacity = '1'; };
  pre.src = popShots[popIdx];
  pop.querySelectorAll('.pop-dots i').forEach(function(d, j){ d.classList.toggle('on', j === popIdx); });
}
function popRestartTimer(){
  clearInterval(popTimer);
  popTimer = setInterval(function(){ popGo(popIdx + 1); }, 1800);
}
function showPop(app, icon){
  if (!app.shots || !app.shots.length) return;
  var p = ensurePop();
  popShots = app.shots; popIdx = 0;
  // 头部: logo + 名称 + 价格
  var head = p.querySelector('.pop-head');
  head.querySelector('img').src = app.icon;
  head.querySelector('b').textContent = app.name;
  head.querySelector('span').textContent = app.price;
  // 宽度档 + 展台高: 竖图 320/368,Mac 横图 456/284
  var wide = popShots[0].indexOf('880x550') !== -1;
  var w = wide ? 456 : 320;
  p.style.setProperty('--pop-w', w + 'px');
  p.querySelector('.pop-stage').style.height = wide ? '284px' : '368px';
  var dots = p.querySelector('.pop-dots');
  dots.innerHTML = popShots.map(function(_, i){ return '<i data-i="' + i + '" class="' + (i === 0 ? 'on' : '') + '"></i>'; }).join('');
  dots.querySelectorAll('i').forEach(function(d){
    d.addEventListener('click', function(){ popGo(+d.dataset.i); popRestartTimer(); });
  });
  var img = p.querySelector('.pop-stage img');
  img.style.opacity = '0'; img.src = popShots[0]; img.alt = app.name;
  img.onload = function(){ img.style.opacity = '1'; };
  // 定位: 锚定图标,优先上方,不够放下方,水平 clamp;弹出方向决定 transform-origin
  var r = icon.getBoundingClientRect();
  var ph = wide ? 380 : 470;
  var x = Math.min(Math.max(10, r.left + r.width / 2 - w / 2), window.innerWidth - w - 10);
  if (r.top > ph + 20) {
    p.style.top = ''; p.style.bottom = (window.innerHeight - r.top + 10) + 'px';
    p.style.transformOrigin = 'bottom center';
  } else {
    p.style.bottom = ''; p.style.top = (r.bottom + 10) + 'px';
    p.style.transformOrigin = 'top center';
  }
  p.style.left = x + 'px';
  p.classList.remove('on'); void p.offsetWidth; // 重触发入场过渡
  p.classList.add('on');
  // 预热后续图 + 自动轮播
  app.shots.forEach(function(u){ var i = new Image(); i.src = u; });
  popRestartTimer();
}
function hidePop(){
  clearInterval(popTimer);
  if (pop) pop.classList.remove('on');
}
function bindShotPop(){
  if (window.matchMedia && window.matchMedia('(hover: none)').matches) return; // 触屏不启用
  var grid = document.getElementById('app-grid');
  grid.addEventListener('mouseover', function(e){
    var ic = e.target.closest('.app-icon');
    if (!ic) return;
    var rt = e.relatedTarget;
    if (rt && rt.closest && rt.closest('.app-icon') === ic) return; // 同一图标内部移动
    var card = ic.closest('.app-card');
    var idx = Array.prototype.indexOf.call(grid.children, card);
    showPop(APPS[idx], ic);
  });
  grid.addEventListener('mouseout', function(e){
    var rt = e.relatedTarget;
    if (rt && rt.closest && rt.closest('.app-icon')) return; // 移向另一个图标,交给 mouseover
    hidePop();
  });
}
